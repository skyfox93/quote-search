default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# The AI agent's SQL (ReadonlySql, through AgentRecord) runs on its own
# connection that logs in as search_agent_reader, a role that can only
# SELECT the transcript tables, so Postgres enforces what it can read. It
# shares the primary database and never runs migrations or other db tasks.
agent: &agent
  adapter: postgresql
  pool: 2
  timeout: 5000
  username: search_agent_reader
  password: <%= ENV["SEARCH_AGENT_DB_PASSWORD"] %>
  database_tasks: false

development:
  primary:
    <<: *default
    database: quotes
    username: postgres
    password: postgres
  agent:
    <<: *agent
    database: quotes

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: quotes_test
  agent:
    <<: *agent
    database: quotes_test # test_helper points this at each parallel worker's database

# On Heroku, DATABASE_URL fills in primary. Heroku's Essential Postgres plans
# can't add logins, so the agent uses AGENT_DATABASE_URL when it is set (a
# SELECT-only credential, e.g. from `heroku pg:credentials:create` on a
# Standard plan) and otherwise the app's own login, where ReadonlySql's
# read-only, rolled-back transaction is what stops writes.
production:
  primary:
    <<: *default
    database: quotes_prod
  agent:
    adapter: postgresql
    pool: 2
    timeout: 5000
    url: <%= ENV["AGENT_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
    database_tasks: false
